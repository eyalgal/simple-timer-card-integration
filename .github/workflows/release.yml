name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/simple_timer_card/manifest.json'))['version'])")
          [ "$tag" = "$version" ] || { echo "Tag $tag does not match manifest version $version"; exit 1; }
      - name: Zip the integration
        run: cd custom_components/simple_timer_card && zip -r ../../simple_timer_card.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: simple_timer_card.zip
